spring:
  application:
    name: veda-ai

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

    show-sql: false

  ai:

    openai:
      api-key: ${GROQ_API_KEY}
      base-url: ${GROQ_API_URL}

      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.1
          max-tokens: 1024

    ollama:
      base-url: ${OLLAMA_API_URL}

      embedding:
        options:
          model: nomic-embed-text

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    root: INFO
    com.vedaai: DEBUG

# noinspection SpringBootApplicationProperties
veda:
  embedding:
    provider: ollama