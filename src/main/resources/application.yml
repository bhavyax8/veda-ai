spring:
  application:
    name: veda-ai
  
  datasource:
    url: jdbc:postgresql://localhost:5432/veda_ai
    username: postgres
    password: vedaai
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.1
          max-tokens: 1024
    
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: nomic-embed-text

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
 

logging:
  level:
    root: INFO
    com.vedaai: DEBUG